name: Build Samgas APK

on:
  push:
    branches:
      - main
    paths:
      - 'samgas/**' # Only run when mobile code changes
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    # Set default working directory for all run steps
    defaults:
      run:
        working-directory: samgas

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samgas/package-lock.json # Path is relative to repo root

      - name: Install dependencies
        run: npm install

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: samgas-android-apk
          # Path is relative to the repo root
          path: samgas/android/app/build/outputs/apk/release/app-release.apk

      - name: Send APK to Telegram
        run: |
          # Path for curl is relative to the working directory
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
               -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "document=@android/app/build/outputs/apk/release/app-release.apk" \
               -F "caption=Build APK baru dari branch '${{ github.ref_name }}' oleh '${{ github.actor }}'. Commit: '${{ github.event.head_commit.message }}'"
