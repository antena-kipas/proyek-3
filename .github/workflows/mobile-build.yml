name: Android Build & Send Telegram (Samgas)

on:
  push:
    branches:
      - main
    paths:
      - 'samgas/**' # Hanya jalan jika ada perubahan di folder mobile

jobs:
  build-android:
    runs-on: ubuntu-latest

    # Menetapkan direktori kerja default ke folder 'samgas'
    defaults:
      run:
        working-directory: samgas

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samgas/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      # Menjalankan build Android (Gantinya flutter build apk)
      - name: Build Android Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # Mengambil versi dari package.json (Gantinya pubspec.yaml)
      - name: Extract version from package.json
        id: extract_version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Extracted version: ${VERSION_NAME}"

      # Rename APK agar rapi (Sesuai panduan dosen)
      - name: Rename APK with version
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/samgas-v${{ env.VERSION_NAME }}.apk

      # Simpan sebagai artifact di GitHub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: samgas-v${{ env.VERSION_NAME }}
          path: samgas/android/app/build/outputs/apk/release/samgas-v${{ env.VERSION_NAME }}.apk

      # Setup Python untuk script Telegram
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      # Eksekusi pengiriman ke Telegram
      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: samgas/android/app/build/outputs/apk/release/samgas-v${{ env.VERSION_NAME }}.apk
        # Menyesuaikan path script jika script berada di folder root .github
        run: python ../.github/send_telegram.py